# ============================================
# GitHub Actions - ETL Automatizado JobForUs
# ============================================
# Este workflow ejecuta el pipeline ETL diariamente
# y opcionalmente puede cargar los datos a BigQuery
# ============================================

name: ETL Automatizado - JobForUs

# Disparadores del workflow
on:
  # Ejecutar diario a las 2:00 AM (hora UTC) / 9:00 PM (hora Perú)
  schedule:
    - cron: '0 2 * * *'
  
  # Permitir ejecución manual desde GitHub
  workflow_dispatch:
  
  # Ejecutar cuando se actualice el dataset
  push:
    paths:
      - 'data/raw/*.csv'
      - 'src/**/*.py'

# Jobs a ejecutar
jobs:
  
  # Job 1: Ejecutar ETL y actualizar datos
  ejecutar-etl:
    name: Ejecutar Pipeline ETL
    runs-on: ubuntu-latest
    
    steps:
      # 1. Clonar el repositorio
      - name: Checkout código
        uses: actions/checkout@v4
      
      # 2. Configurar Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      # 4. Ejecutar el pipeline ETL
      - name: Ejecutar ETL
        run: |
          echo "🚀 Iniciando pipeline ETL..."
          python tests/test_pipeline_completo.py
      
      # 5. Subir resultados transformados (opcional)
      - name: Subir dataset transformado
        uses: actions/upload-artifact@v4
        with:
          name: dataset-transformado
          path: data/processed/
          retention-days: 7
      
      # 6. Notificar completado
      - name: Notificar completado
        run: |
          echo "✅ ETL completado exitosamente"
          echo "📊 Fecha: $(date)"
  
  # Job 2: Cargar a BigQuery (requiere credenciales)
  cargar-a-bigquery:
    name: Cargar datos a BigQuery
    runs-on: ubuntu-latest
    needs: ejecutar-etl
    # Solo ejecutar si se proporcionan credenciales
    if: ${{ secrets.GCP_KEY != '' }}
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Instalar dependencias
        run: |
          pip install pandas numpy google-cloud-bigquery
      
      - name: Crear archivo de credenciales
        run: |
          mkdir -p credentials
          echo '${{ secrets.GCP_KEY }}' > credentials/gcp_key.json
      
      - name: Cargar a BigQuery
        run: |
          python src/load/integration_loader.py
      
      - name: Notificar carga completada
        run: echo "✅ Datos cargados a BigQuery"

  # Job 3: Generar reporte de ejecución
  generar-reporte:
    name: Generar reporte de ejecución
    runs-on: ubuntu-latest
    needs: [ejecutar-etl, cargar-a-bigquery]
    if: always()  # Ejecutar incluso si falla
    
    steps:
      - name: Crear reporte
        run: |
          echo "# Reporte ETL - JobForUs" > reporte.md
          echo "Fecha: $(date)" >> reporte.md
          echo "" >> reporte.md
          echo "## Estado de ejecución" >> reporte.md
          echo "- ETL: ${{ job.status }}" >> reporte.md
          echo "- BigQuery: ${{ needs.cargar-a-bigquery.result }}" >> reporte.md
      
      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-etl
          path: reporte.md
          retention-days: 30