# ============================================
# GitHub Actions - ETL Automatizado JobForUs
# ============================================

name: ETL Automatizado - JobForUs

# Disparadores del workflow
on:
  # Ejecutar diario a las 2:00 AM (UTC) / 9:00 PM (Perú)
  schedule:
    - cron: '0 2 * * *'
  
  # Ejecutar manualmente desde GitHub
  workflow_dispatch:
  
  # Ejecutar cuando se actualice el dataset o los scripts
  push:
    paths:
      - 'JobForUs - Sistema/data/raw/*.csv'
      - 'JobForUs - Sistema/src/**/*.py'
      - 'JobForUs - Sistema/tests/test_pipeline_completo.py'

# Jobs a ejecutar
jobs:
  
  # ============================================
  # JOB 1: Ejecutar ETL y cargar a BigQuery
  # ============================================
  ejecutar-etl-y-carga:
    name: Ejecutar ETL y cargar a BigQuery
    runs-on: ubuntu-latest
    
    steps:
      # 1. Clonar el repositorio
      - name: Checkout código
        uses: actions/checkout@v4
      
      # 2. Configurar Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy google-cloud-bigquery
          if [ -f "JobForUs - Sistema/requirements.txt" ]; then
            pip install -r "JobForUs - Sistema/requirements.txt"
          fi
      
      # 4. Configurar credenciales de Google Cloud
      - name: Configurar credenciales GCP
        run: |
          mkdir -p "JobForUs - Sistema/credentials"
          echo '${{ secrets.GCP_KEY }}' > "JobForUs - Sistema/credentials/gcp-key.json"
      
      # 5. Ejecutar pipeline ETL
      - name: Ejecutar pipeline ETL
        run: |
          cd "JobForUs - Sistema"
          echo "🚀 Iniciando pipeline ETL..."
          python tests/test_pipeline_completo.py << EOF
          1
          EOF
      
      # 6. Cargar datos a BigQuery
      - name: Cargar a BigQuery
        run: |
          cd "JobForUs - Sistema"
          echo "📤 Cargando datos a BigQuery..."
          python src/load/bigquery_loader.py << EOF
          1
          s
          EOF
      
      # 7. Subir artefactos (logs)
      - name: Subir logs
        uses: actions/upload-artifact@v4
        with:
          name: etl-logs
          path: |
            JobForUs - Sistema/*.log
            JobForUs - Sistema/logs/
          retention-days: 7
      
      # 8. Notificar completado
      - name: Notificar completado
        run: |
          echo "✅ ETL y carga completados exitosamente"
          echo "📊 Fecha: $(date)"
          echo "📁 Dataset: jobforus-project.job_market"

  # ============================================
  # JOB 2: Verificar integridad (opcional)
  # ============================================
  verificar-datos:
    name: Verificar integridad de los datos
    runs-on: ubuntu-latest
    needs: ejecutar-etl-y-carga
    if: always()
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Instalar dependencias
        run: |
          pip install pandas google-cloud-bigquery
      
      - name: Configurar credenciales
        run: |
          mkdir -p "JobForUs - Sistema/credentials"
          echo '${{ secrets.GCP_KEY }}' > "JobForUs - Sistema/credentials/gcp-key.json"
      
      - name: Verificar datos
        run: |
          cd "JobForUs - Sistema"
          python -c "
from src.load.bigquery_loader import BigQueryLoader
loader = BigQueryLoader()
if loader.conectar():
    query = 'SELECT COUNT(*) as total FROM `jobforus-project.job_market.fact_oferta`'
    result = loader.client.query(query).to_dataframe()
    print(f'✅ Registros en BigQuery: {result[\"total\"].values[0]}')
"
      
      - name: Generar reporte
        run: |
          echo "# Reporte ETL - JobForUs" > reporte.md
          echo "Fecha: $(date)" >> reporte.md
          echo "✅ Ejecución exitosa" >> reporte.md
      
      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-etl
          path: reporte.md
          retention-days: 30